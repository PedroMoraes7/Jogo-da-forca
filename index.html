<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Forca</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Jogo da Forca</h1>

    <section aria-labelledby="word-heading">
      <h2 id="word-heading">Palavra</h2>
      <p class="word" aria-label="Palavra a adivinhar">_ _ _ _ _</p>
    </section>

    <section aria-labelledby="wrong-letters-heading">
      <h2 id="wrong-letters-heading">Letras erradas</h2>
      <p class="wrong-letters" aria-label="Nenhuma letra errada"></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
